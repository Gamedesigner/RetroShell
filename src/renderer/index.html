<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RetroShell</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/crt.css">
    <link rel="stylesheet" href="styles/cube.css">
    <link rel="stylesheet" href="styles/fonts.css">
</head>
<body class="crt">
    <div id="window-frame">
        <div id="title-bar">
            <span id="title">RETROSHELL v1.0</span>
            <div id="controls">
                <button id="cube-btn" title="3D Holographic Mode (Ctrl+3)">3D</button>
                <button id="settings-btn" title="Settings (Ctrl+,)">*</button>
                <button onclick="window.electronAPI.minimizeWindow()">_</button>
                <button onclick="window.electronAPI.maximizeWindow()">[]</button>
                <button onclick="window.electronAPI.closeWindow()">X</button>
            </div>
        </div>
        <div id="terminal-container"></div>
        <div id="holo-cube-container" class="hidden">
            <div id="holo-topbar">
                <div id="holo-mode-switch">
                    <button data-mode="cube" class="active" title="Terminal in the cube">CUBE</button>
                    <button data-mode="files" title="File graph of the current folder">FILES</button>
                </div>
                <div id="holo-path-bar" class="hidden">
                    <button id="holo-up-btn" title="Go up one folder (same as double-clicking the root)">UP</button>
                    <span id="holo-path"></span>
                </div>
            </div>
            <div id="holo-prompt-line" class="hidden"></div>
            <div id="holo-file-panel">
                <div id="holo-file-header">
                    <span id="holo-file-name"></span>
                    <button id="holo-file-close" title="Close">X</button>
                </div>
                <dl id="holo-file-details"></dl>
                <div id="holo-file-actions">
                    <button id="holo-file-root" title="Make this file's folder the root of the graph">OPEN FOLDER IN GRAPH</button>
                    <button id="holo-file-explorer" title="Open the folder in Windows Explorer with the file selected">SHOW IN EXPLORER</button>
                </div>
            </div>
        </div>
        <div id="status-bar">
            <span id="date"></span>
            <span id="time"></span>
        </div>
    </div>
    
    <!-- Settings Panel -->
    <div id="settings-overlay" class="hidden">
        <div id="settings-panel">
            <div id="settings-header">
                <span>SETTINGS</span>
                <button id="settings-close">X</button>
            </div>
            <div id="settings-content">
                <div class="settings-group">
                    <label>COLOR THEME:</label>
                    <select id="theme-select">
                        <option value="holographic">Holographic (Another World)</option>
                        <option value="dosBlue">DOS Blue</option>
                        <option value="amber">Amber</option>
                        <option value="greenPhosphor">Green Phosphor</option>
                    </select>
                </div>
                <div class="settings-group">
                    <label>
                        <input type="checkbox" id="sound-toggle" checked>
                        SOUND EFFECTS
                    </label>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Window resize handles -->
    <div class="resize-handle" data-edge="n"></div>
    <div class="resize-handle" data-edge="s"></div>
    <div class="resize-handle" data-edge="w"></div>
    <div class="resize-handle" data-edge="e"></div>
    <div class="resize-handle" data-edge="nw"></div>
    <div class="resize-handle" data-edge="ne"></div>
    <div class="resize-handle" data-edge="sw"></div>
    <div class="resize-handle" data-edge="se"></div>

    <script src="./terminal.js"></script>
    <script src="./settings.js"></script>
    <script src="./holoCube.js"></script>
</body>
</html>
